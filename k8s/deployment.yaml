# Example Deployment. Build the image from this repo's Dockerfile and point
# `image` at your registry. Secrets referenced below:
#   kubectl create secret generic aura-bridge-slack \
#     --from-literal=SLACK_BOT_TOKEN=... --from-literal=SLACK_APP_TOKEN=...
#   kubectl create secret generic aura-bridge-pd-webhook --from-literal=token=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-bridge
  labels:
    app.kubernetes.io/name: aura-bridge
spec:
  # Must stay 1: the SSE stream to aura, the pending-approval registry, and the
  # conversation tree are all in-process, and Slack Socket Mode round-robins
  # events across connections — a second replica would strand approvals.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aura-bridge
    spec:
      containers:
        - name: aura-bridge
          image: your-registry.example.com/aura-bridge:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AURA_MODE
              value: real
            # The aura web server's in-cluster address.
            - name: AURA_URL
              value: http://aura.aura.svc.cluster.local
            - name: SLACK_MODE
              value: real
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aura-bridge-slack
                  key: SLACK_BOT_TOKEN
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aura-bridge-slack
                  key: SLACK_APP_TOKEN
            # Shared token the PD incident workflow sends as X-Bridge-Token.
            - name: PD_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aura-bridge-pd-webhook
                  key: token
            - name: STATE_FILE
              value: /data/state.json
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        # Transcript snapshots survive container restarts, not rescheduling —
        # in-flight investigations die with the SSE stream anyway.
        - name: data
          emptyDir: {}
